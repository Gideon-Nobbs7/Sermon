[project]
name = "sermon-bot"
version = "0.1.0"
description = "Sermon QA bot — RAG over church sermon notes (scope 1: ingestion scaffold)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "markdown-it-py>=4.0.0",
    "langchain-community>=0.3.31",
    "langchain-text-splitters>=0.3.11",
    "pypdf>=6.14.2",
    "python-docx>=1.1.0",
    "sqlite-vec>=0.1.6",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
